# Automatically generates draft releases based on merged PRs
# A PR with labels of several categories is listed in each of them
# The old labels (pr/feature, pr/impovement, pr/refactor, pr/meta, pr/ignoreChangelog) are kept so older PRs still sort correctly

name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'

categories:
  - title: 'Features 🚀'
    labels:
      - pr/new
      - pr/improvement
      - pr/feature
      - pr/impovement
  - title: 'Bug Fixes 🐛'
    labels:
      - pr/fix
  - title: 'Settings ⚙️'
    labels:
      - pr/settings
  - title: 'Translation 📚'
    labels:
      - pr/translation
  - title: 'Documentation 📚'
    labels:
      - pr/docs
  - title: 'Maintenance 🛠️'
    labels:
      - pr/maintenance
      - pr/cleanup
      - pr/refactor
      - pr/meta
  - title: 'Breaking Changes ⚠️'
    labels:
      - pr/breaking

# change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
exclude-labels:
  - pr/ignore
  - pr/ignoreChangelog

change-template: '* $TITLE (#$NUMBER) by @$AUTHOR'
template: |
  _Requires the latest Version of [CBA](https://github.com/CBATeam/CBA_A3) and [ACE](https://github.com/acemod/ACE3)._

  ## Summary

  ## Changelog

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

replacers:
  # Category titles
  # Release Drafter automatically makes the category a ## heading
  # and we want it as a ### heading
  - search: '/\#\# (\#\#\# (NEW|FIXED|IMPROVED|CHANGED|SETTINGS|TRANSLATIONS|DOCUMENTATION):)/g'
    replace: '$1'
